<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">EOC visual direction board</title>
  <desc id="description">Three visual directions for the emergency operations center. Crimson Command is selected and shown across login, dashboard, list, detail, form, and empty/error states.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#111722"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f3f5f8"/>
    </linearGradient>
    <linearGradient id="red" x2="1" y2="1">
      <stop stop-color="#e33b45"/>
      <stop offset="1" stop-color="#ae0000"/>
    </linearGradient>
    <style>
      text{font-family:Arial,sans-serif;fill:#f6f6f7}
      .muted{fill:#9ba7b7}
      .tiny{font-size:12px}
      .small{font-size:16px}
      .title{font-size:30px;font-weight:700}
      .section{font-size:19px;font-weight:700}
      .card{fill:#151c26;stroke:#35404f}
      .light-text{fill:#10151f}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#080b10"/>
  <text x="64" y="72" class="title">EOC / VISUAL DIRECTIONS</text>
  <text x="64" y="104" class="small muted">Egyptian Red Crescent · Operations interface · Arabic-first / RTL</text>

  <g transform="translate(64 145)">
    <rect width="460" height="190" rx="22" fill="url(#night)" stroke="#3d4652"/>
    <rect x="20" y="20" width="420" height="150" rx="16" fill="none" stroke="#ae0000" stroke-opacity=".65"/>
    <text x="42" y="66" class="section">01 · CRIMSON COMMAND</text>
    <text x="42" y="98" class="small muted">Selected · crisp surfaces, precise red signals</text>
    <text x="42" y="132" class="tiny muted">Mission focus / calm hierarchy / low-noise motion</text>
    <rect x="390" y="42" width="26" height="26" rx="9" fill="url(#red)"/>
  </g>
  <g transform="translate(570 145)">
    <rect width="460" height="190" rx="22" fill="#112027" stroke="#33545a"/>
    <text x="42" y="66" class="section">02 · SIGNAL ATLAS</text>
    <text x="42" y="98" class="small muted">Map-led · teal and amber signal categories</text>
    <text x="42" y="132" class="tiny muted">More spatial data emphasis, less editorial density</text>
    <circle cx="403" cy="55" r="15" fill="#21a99a" fill-opacity=".85"/>
  </g>
  <g transform="translate(1076 145)">
    <rect width="460" height="190" rx="22" fill="#f4f1eb" stroke="#d7d2c8"/>
    <text x="42" y="66" class="section light-text">03 · FIELD CONSOLE</text>
    <text x="42" y="98" class="small" fill="#596273">Warm paper · compact dispatch tooling</text>
    <text x="42" y="132" class="tiny" fill="#707a88">Field notebook cues, designed for long shifts</text>
    <rect x="388" y="40" width="28" height="28" rx="8" fill="#d5a54c"/>
  </g>

  <text x="64" y="390" class="section">SELECTED DIRECTION · CRIMSON COMMAND / COMPONENT PREVIEW</text>
  <g transform="translate(64 420)">
    <rect width="460" height="240" rx="20" fill="url(#paper)" stroke="#394351"/>
    <text x="26" y="34" class="small light-text" font-weight="700">LOGIN</text>
    <rect x="26" y="56" width="408" height="166" rx="17" fill="#fff" stroke="#d8dee8"/>
    <rect x="45" y="78" width="44" height="44" rx="14" fill="#f8fafc" stroke="#d8dee8"/>
    <path d="M70 88a12 12 0 1 0 0 24 10 10 0 1 1 0-24" fill="#ae0000"/>
    <rect x="110" y="80" width="120" height="12" rx="6" fill="#202a37"/>
    <rect x="110" y="101" width="76" height="8" rx="4" fill="#a3adba"/>
    <rect x="45" y="143" width="360" height="30" rx="9" fill="#f8fafc" stroke="#d8dee8"/>
    <rect x="45" y="183" width="360" height="26" rx="9" fill="url(#red)"/>
  </g>
  <g transform="translate(570 420)">
    <rect width="460" height="240" rx="20" fill="url(#night)" stroke="#394351"/>
    <text x="26" y="34" class="small" font-weight="700">DASHBOARD / LIST</text>
    <rect x="22" y="55" width="62" height="165" rx="15" fill="#0e131b" stroke="#303b48"/>
    <rect x="33" y="67" width="40" height="32" rx="10" fill="#25202a" stroke="#aa2931"/>
    <rect x="99" y="55" width="338" height="34" rx="11" fill="#151c26" stroke="#303b48"/>
    <text x="414" y="77" class="tiny muted" text-anchor="end">مركز العمليات</text>
    <rect x="99" y="103" width="105" height="58" rx="13" class="card"/>
    <rect x="215" y="103" width="105" height="58" rx="13" class="card"/>
    <rect x="331" y="103" width="106" height="58" rx="13" class="card"/>
    <rect x="99" y="174" width="338" height="46" rx="12" class="card"/>
    <circle cx="118" cy="124" r="5" fill="#ce222c"/>
    <circle cx="234" cy="124" r="5" fill="#42b889"/>
    <circle cx="350" cy="124" r="5" fill="#e1ad51"/>
  </g>
  <g transform="translate(1076 420)">
    <rect width="460" height="240" rx="20" fill="url(#night)" stroke="#394351"/>
    <text x="26" y="34" class="small" font-weight="700">DETAIL / FORM / EMPTY-ERROR</text>
    <rect x="24" y="55" width="198" height="165" rx="13" class="card"/>
    <text x="42" y="82" class="tiny muted">MISSION DETAIL</text>
    <rect x="42" y="98" width="161" height="9" rx="4" fill="#626d7c"/>
    <rect x="42" y="118" width="133" height="9" rx="4" fill="#424d5c"/>
    <rect x="42" y="143" width="161" height="54" rx="10" fill="#10151d" stroke="#35404f"/>
    <rect x="238" y="55" width="198" height="77" rx="13" class="card"/>
    <text x="256" y="82" class="tiny muted">FORM FIELD</text>
    <rect x="256" y="96" width="161" height="23" rx="7" fill="#0d1219" stroke="#414d5d"/>
    <rect x="238" y="144" width="198" height="76" rx="13" fill="#111720" stroke="#35404f" stroke-dasharray="5 5"/>
    <circle cx="337" cy="177" r="11" fill="#202a37"/>
    <text x="337" y="181" class="tiny muted" text-anchor="middle">!</text>
    <text x="337" y="204" class="tiny muted" text-anchor="middle">EMPTY / ERROR</text>
  </g>

  <text x="64" y="728" class="section">IMPLEMENTATION PRINCIPLES</text>
  <g transform="translate(64 752)">
    <rect width="1472" height="170" rx="20" fill="#0e131b" stroke="#303b48"/>
    <text x="32" y="48" class="small">01  Semantic light/dark tokens · contrast-first text · persistent EOC identity</text>
    <text x="32" y="86" class="small">02  Quiet, layered surfaces · red reserved for priority · consistent radii and spacing</text>
    <text x="32" y="124" class="small">03  Transform/opacity interactions · keyboard-visible focus · reduced-motion support</text>
    <text x="32" y="152" class="tiny muted">Illustrative design board · SVG can be imported into Figma as editable vector artwork</text>
  </g>
</svg>
