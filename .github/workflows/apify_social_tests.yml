name: Apify social intake tests

on:
  push:
    branches:
      - feature/apify-social-radar-budget-2026-10-13
      - fix/osiris-real-incident-validation-2026-10-13
      - fix/social-search-budget-safe-2026-10-13

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check requests feedparser beautifulsoup4
      - name: Test Apify adapter and social/news dedupe without spending credits
        run: python -m unittest -v test_incident_validation.py test_apify_social_sources.py test_ai_news_dedupe.py test_social_media_sources.py
      - name: Test existing AI analysis resilience without live model calls
        run: python test_ai_radar_resilience.py
