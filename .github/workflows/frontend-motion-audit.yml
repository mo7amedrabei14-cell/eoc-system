name: Frontend motion regression

on:
  push:
    branches:
      - audit/repair-motion-blockers-2026-10-12
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-motion-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete frontend test suite
        run: npm test

      - name: Build frontend for production
        run: npm run build
