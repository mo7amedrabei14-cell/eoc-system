name: Frontend motion audit

on:
  push:
    branches:
      - fix/full-motion-system-audit
  pull_request:
    branches:
      - main
    paths:
      - "frontend/src/**"
      - ".github/workflows/frontend-motion-audit.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-motion-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Full frontend test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lint motion controller and motion regression tests
        run: npx eslint src/App.jsx src/__tests__/motionAudit.test.js src/motion/visualTransitions.js

      - name: Record repository-wide lint baseline
        id: full_lint
        shell: bash
        run: |
          set +e
          npm run lint
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide lint has existing failures in unrelated code; this non-blocking baseline is reported separately from the scoped motion lint."
          fi
          exit 0
