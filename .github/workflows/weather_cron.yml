name: Weather Intelligence Daily Runner 🌤️

on:
  schedule:
    - cron: "0 */2 * * *"   # كل ساعتين
  workflow_dispatch:
jobs:
  weather-intel:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة البايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تسطيب المكتبات المطلوبة
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل محرك استخبارات الطقس
        env:
          SYSTEM_TOKEN: ${{ secrets.SYSTEM_TOKEN }}
          SYSTEM_API_URL: ${{ secrets.SYSTEM_API_URL || 'https://eoc-system-qaol.vercel.app/' }}
          HISTORY_WINDOW_DAYS: ${{ secrets.HISTORY_WINDOW_DAYS || '3' }}
          MIN_SAMPLES: ${{ secrets.MIN_SAMPLES || '20' }}
        run: python weather_intel.py
