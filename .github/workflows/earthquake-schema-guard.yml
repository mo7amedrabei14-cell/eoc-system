name: Earthquake schema deadlock regression

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "test_eq_schema_bootstrap.py"
      - ".github/workflows/earthquake-schema-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "test_eq_schema_bootstrap.py"
      - ".github/workflows/earthquake-schema-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthquake-schema-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Run earthquake deadlock regression tests
        run: python -m unittest test_eq_schema_bootstrap -v
