name: Earthquake schema deadlock regression

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "test_eq_schema_bootstrap.py"
      - "test_eq_schema_postgres_concurrency.py"
      - ".github/workflows/earthquake-schema-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "test_eq_schema_bootstrap.py"
      - ".github/workflows/earthquake-schema-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthquake-schema-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_DATABASE_URL: postgresql://eoc_test:eoc_test@localhost:5432/eoc_schema_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eoc_schema_test
          POSTGRES_USER: eoc_test
          POSTGRES_PASSWORD: eoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eoc_test -d eoc_schema_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL test driver
        run: python -m pip install "psycopg[binary]>=3.1,<4"
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Run PostgreSQL lock-order integration test
        run: python -m unittest test_eq_schema_postgres_concurrency -v
      - name: Run earthquake deadlock regression tests
        run: python -m unittest test_eq_schema_bootstrap -v
