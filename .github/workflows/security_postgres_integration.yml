name: Security PostgreSQL integration tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - security/hardening-auth-cache-active-users-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eoc_test
          POSTGRES_PASSWORD: eoc_test_password
          POSTGRES_DB: eoc_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eoc_test -d eoc_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EOC_TEST_DATABASE_URL: postgresql://eoc_test:eoc_test_password@localhost:5432/eoc_security_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]"
      - name: Run security integration tests against disposable PostgreSQL
        run: python -m unittest -v test_security_postgres_integration.py
      - name: Run source-level hardening regression checks
        run: python -m unittest -v test_security_hardening.py
