name: Earthquake Intelligence Runner 🌍

on:
  schedule:
    # ⚠️ مصدر استيعاب واحد: هذا الكرن يستدعي دورة المحرك داخل الخادم (tick) —
    #    ولو كان الخيط المحلي حياً في الخادم (استضافة دائمة) تُرجع الدورة skipped
    #    تلقائياً فلا استطلاع مزدوج أبداً.
    #    ✔️ اتركه مفعلاً طالما Backend على Serverless (هو ضمان الاستمرارية هناك).
    #    ✂️ يمكنك حذف جدول schedule كاملاً بعد الانتقال لاستضافة دائمة يؤكد
    #       /api/earthquake-intel/status وجود engine.mode = "local_thread".
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  quake-watch:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة البايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تسطيب المكتبة المطلوبة
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv

      - name: تشغيل محرك رصد الزلازل
        env:
          SYSTEM_TOKEN: ${{ secrets.SYSTEM_TOKEN }}
          SYSTEM_API_URL: ${{ secrets.SYSTEM_API_URL || 'https://eoc-system-qaol.vercel.app/' }}
        run: python earthquake_intel.py
