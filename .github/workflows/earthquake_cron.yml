name: Earthquake Intelligence Runner 🌍

on:
  schedule:
    # ⚠️ مصدر استيعاب واحد فقط — لا يعمل شيء آخر بجانبه في نفس الوقت.
    #
    #    🚫 NOT a real-time path. GitHub Actions does not support schedules
    #    below 5 minutes. `*/1` is accepted by the parser but is throttled and
    #    silently delayed by the platform, so it delivers neither 1-minute nor
    #    reliable 5-minute latency — it only adds load. Reverted to */5.
    #
    #    This cron is the CONTINUITY PATH ONLY. It fires the engine tick on the
    #    serverless backend, where no permanent in-process thread can live.
    #    If the engine's own local thread is alive (engine.mode = "local_thread")
    #    the tick returns `skipped`: mutual exclusion is enforced by a
    #    transaction-scoped advisory lock in code, not by convention, so exactly
    #    one ingester ever runs (verified by _test_eq_ingest.py).
    #
    #    ⇒ TO REACH THE ~30s TARGET: move ingestion to a permanent worker
    #      (option A in the architecture decision), then DELETE this schedule
    #      block entirely and keep only `workflow_dispatch` below for manual and
    #      emergency runs. Two schedulers must never both be active.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  quake-watch:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة البايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تسطيب المكتبة المطلوبة
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv

      - name: تشغيل محرك رصد الزلازل
        env:
          SYSTEM_TOKEN: ${{ secrets.SYSTEM_TOKEN }}
          SYSTEM_API_URL: ${{ secrets.SYSTEM_API_URL || 'https://eoc-backend-neon.vercel.app/' }}
        run: python earthquake_intel.py
