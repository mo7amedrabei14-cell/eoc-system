name: AI Radar Scanner 🤖

on:
  schedule:
    - cron: '0 * * * *'

# Keep a scheduled scan and a manual run from spending budget concurrently.
concurrency:
  group: ai-radar-scan
  cancel-in-progress: false

jobs:
  scan-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة البايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تسطيب المكتبات المطلوبة
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: تشغيل محرك الذكاء الاصطناعي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_SOCIAL_MAX_AGE_MINUTES: ${{ vars.APIFY_SOCIAL_MAX_AGE_MINUTES || '30' }}
          APIFY_DAILY_RESULT_CAP: ${{ vars.APIFY_DAILY_RESULT_CAP || '50' }}
          APIFY_MONTHLY_RESULT_CAP: ${{ vars.APIFY_MONTHLY_RESULT_CAP || '1000' }}
          SYSTEM_TOKEN: ${{ secrets.SYSTEM_TOKEN }}
          # Set this to the active backend base URL, or to /api/ai-news itself.
          SYSTEM_API_URL: ${{ secrets.SYSTEM_API_URL || 'https://eoc-system-virid.vercel.app' }}
          # Public channel/page identifiers are repository Actions Variables.
          OSINT_TELEGRAM_CHANNELS: ${{ vars.OSINT_TELEGRAM_CHANNELS }}
          OSINT_EXTRA_SOCIAL_FEEDS: ${{ vars.OSINT_EXTRA_SOCIAL_FEEDS }}
          OSINT_YOUTUBE_CHANNEL_IDS: ${{ vars.OSINT_YOUTUBE_CHANNEL_IDS }}
          OSINT_REDDIT_SUBREDDITS: ${{ vars.OSINT_REDDIT_SUBREDDITS }}
          META_FACEBOOK_PAGE_IDS: ${{ vars.META_FACEBOOK_PAGE_IDS }}
          META_INSTAGRAM_USER_IDS: ${{ vars.META_INSTAGRAM_USER_IDS }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v24.0' }}
          # Platform access tokens/credentials belong in Actions Secrets only.
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python ai_radar.py
