name: AI Radar Scanner 🤖

on:
  schedule:
    - cron: '0 */2 * * *' # التشغيل كل ساعتين
  workflow_dispatch: # زرار للتشغيل اليدوي لو حبيت

jobs:
  scan-news:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة البايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: تسطيب المكتبات المطلوبة
        run: |
          pip install feedparser requests google-generativeai beautifulsoup4

      - name: تشغيل محرك الذكاء الاصطناعي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYSTEM_TOKEN: ${{ secrets.SYSTEM_TOKEN }}
        run: python ai_radar.py